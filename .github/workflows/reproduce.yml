name: Portable research reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constraint-bridge:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv
          venv.EnvBuilder(with_pip=True).create(".venv")
          binaries = Path(".venv").resolve() / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(binaries) + "\n")
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Validate exported inputs
        run: python -B examples/reproduce_constraint_bridge.py --verify-inputs-only
      - name: Run portable controls
        run: python -B -m pytest -q
      - name: Prepare reproduction parent directory
        run: python -c "from pathlib import Path; Path('outputs').mkdir(exist_ok=True)"
      - name: Recompute the full continuum bridge
        run: python -B examples/reproduce_constraint_bridge.py --output outputs/constraint-bridge
      - name: Retain reproduction output including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constraint-bridge-${{ matrix.os }}
          path: outputs/constraint-bridge/
          if-no-files-found: ignore
          retention-days: 14

  native-components:
    name: C++ reference component controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure C++17 references
        run: cmake -S science/numerical_relativity/cpp -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build the three registered component tests
        run: cmake --build build/native --target nr-fo-topology-test nr-fo-spatial-order-test nr-fo-schwarzschild-domain-test --parallel 2
      - name: Check topology, spatial operators and domain classification
        run: ctest --test-dir build/native --output-on-failure --timeout 60
